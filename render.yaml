databases:
  - name: dukaan-ledger-db
    databaseName: dukaan_ledger_db
    user: dukaan_ledger_db_user
    plan: free
    region: singapore

services:
  - type: web
    name: dukaan-ledger-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dukaan-ledger-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: OIDC_COOKIE_SECRET
        generateValue: true
      - key: FRONTEND_ORIGINS
        value: https://dukaan-ledger-phi.vercel.app
      - key: OIDC_ISSUER_URL
        value: https://dukaan-ledger-api-vxuc.onrender.com/oidc
      - key: OIDC_FRONTEND_URL
        value: https://dukaan-ledger-phi.vercel.app
      - key: OIDC_CLIENTS
        value: "[]"
