name: Mobile app CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - run: npm install
      - run: npx expo install --fix
      - run: npx expo-doctor
      - run: npm run typecheck
      - run: npm test
      - run: npm run export:android
